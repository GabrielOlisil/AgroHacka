name: Release - Windows, Android e Linux (AgroHacka)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# .env.production não é versionado; sem esta URL o app abre em branco (client.ts lança no import).
# Para outra API, defina a variável de repositório VITE_API_URL no GitHub.
env:
  VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.arikem.qzz.io' }}

jobs:
  build-desktop-windows:
    name: Build Windows (.exe / .msi / portable)
    runs-on: windows-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Configurar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Instalar Dependências do Cliente
        working-directory: client
        run: npm ci

      - name: Compilar Instaladores Tauri Windows
        working-directory: client
        run: npx @tauri-apps/cli build --bundles nsis,msi

      - name: Preparar executável portable
        shell: pwsh
        run: |
          Copy-Item -LiteralPath client/src-tauri/target/release/app.exe -Destination client/src-tauri/target/release/app-portable.exe -ErrorAction Stop

      - name: Upload Artefatos Windows (.exe / .msi / portable)
        uses: actions/upload-artifact@v4
        with:
          name: agrohacka-desktop-windows
          path: |
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/src-tauri/target/release/bundle/msi/*.msi
            client/src-tauri/target/release/app-portable.exe
          if-no-files-found: error

  build-desktop-linux:
    name: Build Linux (.AppImage)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências Linux do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Configurar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Dependências do Cliente
        working-directory: client
        run: npm ci

      - name: Compilar AppImage
        working-directory: client
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx @tauri-apps/cli build --bundles appimage

      - name: Upload Artefatos Linux (.AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: agrohacka-desktop-linux
          path: client/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-mobile-android:
    name: Build Mobile Android (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK e NDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager 2>/dev/null | head -1)
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi
          NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ] && [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          fi
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Configurar Rust Toolchain para Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Instalar Dependências do Desktop
        working-directory: client
        run: npm ci

      - name: Compilar Frontend Vite
        working-directory: client
        run: npm run build

      - name: Inicializar Projeto Android Tauri (se ainda não existir)
        working-directory: client
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx @tauri-apps/cli android init --ci
          fi

      - name: Garantir permissão de câmera no AndroidManifest
        working-directory: client
        run: node ./src/scripts/garantir-permissao-camera.ts src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Aplicar insets das barras do sistema na MainActivity
        working-directory: client
        run: node ./src/scripts/aplicar-insets-android.ts src-tauri/gen/android/app/src/main/java/com/agrohack/desktop/MainActivity.kt

      - name: Compilar Pacote Android (.apk)
        working-directory: client
        run: npx @tauri-apps/cli android build --apk --debug --target aarch64 --ci

      - name: Upload Artefatos Android (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: agrohacka-mobile-android
          path: client/src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

  create-release:
    name: Publicar Windows, Android e Linux no GitHub Releases
    needs: [build-desktop-windows, build-mobile-android, build-desktop-linux]
    if: |
      needs.build-desktop-windows.result == 'success' &&
      needs.build-desktop-linux.result == 'success' &&
      needs.build-mobile-android.result == 'success' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Artefatos do Windows
        uses: actions/download-artifact@v4
        with:
          name: agrohacka-desktop-windows
          path: release-assets/windows

      - name: Baixar Artefatos do Linux
        uses: actions/download-artifact@v4
        with:
          name: agrohacka-desktop-linux
          path: release-assets/linux

      - name: Baixar Artefatos do Android
        uses: actions/download-artifact@v4
        with:
          name: agrohacka-mobile-android
          path: release-assets/android

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          # main: pré-release por execução; tags v*: release oficial da tag.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('android-build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: AgroHacka - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number) }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/android/**/*.apk
            release-assets/windows/**/*.exe
            release-assets/windows/**/*.msi
            release-assets/linux/**/*.AppImage

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
