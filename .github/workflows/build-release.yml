name: Release - Build Desktop e Mobile (AgroHacka)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# .env.production não é versionado; sem esta URL o app abre em branco (client.ts lança no import).
# Para outra API, defina a variável de repositório VITE_API_URL no GitHub.
env:
  VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.arikem.qzz.io' }}

jobs:
  build-desktop-windows:
    name: Build Desktop Windows (.exe / .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Configurar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Instalar Dependências do Desktop
        working-directory: desktop
        run: npm ci

      - name: Compilar Frontend Vite
        working-directory: desktop
        run: npm run build

      - name: Compilar Instalador Tauri Windows
        working-directory: desktop
        run: npx @tauri-apps/cli build

      - name: Upload Artefatos Windows (.exe / .msi)
        uses: actions/upload-artifact@v4
        with:
          name: agrohacka-desktop-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-mobile-android:
    name: Build Mobile Android (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK e NDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager 2>/dev/null | head -1)
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi
          NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ] && [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          fi
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Configurar Rust Toolchain para Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Instalar Dependências do Desktop
        working-directory: desktop
        run: npm ci

      - name: Compilar Frontend Vite
        working-directory: desktop
        run: npm run build

      - name: Inicializar Projeto Android Tauri (se ainda não existir)
        working-directory: desktop
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx @tauri-apps/cli android init --ci
          fi

      - name: Garantir permissão de câmera no AndroidManifest
        working-directory: desktop
        run: node ./src/scripts/garantir-permissao-camera.ts src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Compilar Pacote Android (.apk)
        working-directory: desktop
        run: npx @tauri-apps/cli android build --apk --debug --target aarch64

      - name: Upload Artefatos Android (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: agrohacka-mobile-android
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  create-release:
    name: Publicar Release Oficial no GitHub
    needs: [build-desktop-windows, build-mobile-android]
    if: |
      always() &&
      (needs.build-desktop-windows.result == 'success' || needs.build-mobile-android.result == 'success') &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Artefatos do Windows
        if: needs.build-desktop-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: agrohacka-desktop-windows
          path: release-assets/windows

      - name: Baixar Artefatos do Android
        if: needs.build-mobile-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: agrohacka-mobile-android
          path: release-assets/android

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0-entrega' }}
          name: AgroHacka - Versão Oficial ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/**/*

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
